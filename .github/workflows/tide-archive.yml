# PNW Weather Tides page: every 6 h, refresh the AIFS ENS pressure, SST and STOFS anomaly sidecars, then archive the
# STOFS-free Conditional snapshot (port of Benjamin's tide-archive job at 7f37665, guide section 15; WA + CA stations).
# Scheduled workflows run from main only, so this new version starts once preview/tide-conditional is merged to main.
# Writes to the orphan branch "tide-archive" (v1/<station>/<YYYY-MM>.json, v1/index.json, v1/sst.json,
# v1/aifs_ens_msl.json, v1/stofs_anom.json). The site reads them from raw.githubusercontent.com (public, CORS *).
# A 404 there must not break the page: tide.js uses the copy shipped with the site, or holds observed pressure /
# leaves the warm-water term at zero. No R2, no secrets: NOAA / ECMWF open data is public and the push uses this
# workflow's own GITHUB_TOKEN. No workflow here runs on push, so these commits trigger nothing.
# Issue slots 02/08/14/20 UTC (~30-60 min after each STOFS cycle lands). SST is refreshed every run (~2-day latency).
name: tide-archive
on:
  schedule:
    - cron: "20 2,8,14,20 * * *"
  workflow_dispatch:
concurrency:
  group: tide-archive
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COOPS_STATS: ${{ github.workspace }}/coops_stats.json   # per-run CO-OPS call counts + shared 403/429 back-off budget
      COOPS_THROTTLE_BUDGET_S: "240"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/fast/tide_archive
            tools/fast/site/tide/sst.json
          path: src
      - uses: actions/checkout@v4
        with:
          ref: tide-archive
          path: arch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB / netCDF libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libeccodes-tools libnetcdf-dev
          python -m pip install --quiet "numpy<2.3" eccodes netCDF4
      - name: Refresh AIFS ENS pressure, SST, and STOFS anomaly sidecars
        # Keep going if one sidecar fails: the snapshot and the page have persist / W=0 fallbacks.
        run: |
          python src/tools/fast/tide_archive/refresh_tide_sidecars.py \
            --out arch \
            --seed-sst src/tools/fast/site/tide/sst.json \
            --aifs-work "$RUNNER_TEMP/aifs_ens_msl" \
            || echo "sidecar refresh reported an error; archive will use whatever is already on the branch plus page fallbacks"
      - name: Snapshot (live STOFS-free residual; marks itself hindcast if the run is >3 h late)
        run: python src/tools/fast/tide_archive/tide_archive.py --out arch --issue now
      - name: Daily self-calibration, background only (new coefficients at the 08 UTC = 12 AM PST run; stored as rc/cal, not shown on the site)
        run: |
          python src/tools/fast/tide_archive/calibrate.py --out arch --from now --to now \
            || echo "::warning::calibration failed (background-only); snapshots and sidecars are still pushed"
      - name: Commit and push
        working-directory: arch
        run: |
          git config user.name "tide-archive bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git diff --cached --quiet && exit 0
          git commit -q -m "tide archive $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3; do git push -q origin HEAD:tide-archive && exit 0; git pull -q --rebase origin tide-archive; done
          exit 1
      - name: CO-OPS call counts (snapshot vs calibration)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = os.environ["COOPS_STATS"]; d = json.load(open(p)) if os.path.exists(p) else {}
          tot = {k: sum(int((d.get(s) or {}).get(k, 0)) for s in d) for k in ("calls", "http403", "http429")}
          wait = sum(float((d.get(s) or {}).get("throttle_wait_s", 0)) for s in d)
          rows = ["| step | calls | 403 | 429 | throttle wait s | gave up | skipped stations |", "|---|---|---|---|---|---|---|"]
          for s in ("snapshot", "calibration"):
              v = d.get(s)
              if v: rows.append(f"| {s} | {v['calls']} | {v['http403']} | {v['http429']} | {v['throttle_wait_s']:.0f} | {'yes' if v['gave_up'] else 'no'} | {', '.join(v['skipped_stations']) or '-'} |")
          rows.append(f"| total | {tot['calls']} | {tot['http403']} | {tot['http429']} | {wait:.0f} | | |")
          txt = "### CO-OPS calls this run\n\n" + "\n".join(rows) + "\n"
          print(txt)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(txt)
          PY
