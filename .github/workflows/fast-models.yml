# Fast-style model data -> R2 bucket pnw-models-data. This is the only model workflow in the repo:
# HRRR, RRFS, NBM, GFS, IFS, AIFS, EPS, AIFS ENS, WW3, AIFS ENS members, EPS members, and OISST are jobs here.
# Writes go to preview/ keys (WX_R2_PREFIX) unless a dispatch sets prefix to a deployment area
# such as preview-pr16/. Production keeps reading the live keys until someone runs this
# workflow by hand with promote=true, which copies preview/ onto the live keys and does not encode.
# Promote does not copy preview-pr16/ or any other preview-<name>/ prefix.
# Schedule is every 15 min. Each job also polls every 60 s (--watch) and uploads the hours that are out
# (one frame at a time once the job is caught up). A job that still has hours left re-dispatches itself.
# GitHub only runs this schedule from the default branch, and a private repo spends Actions minutes while it watches.
# Needs repo secrets PNW_R2_ACCESS_KEY_ID and PNW_R2_SECRET_ACCESS_KEY. The Pages API token is the other site and is not read.
name: fast-models
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "comma list: hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst"
        default: "hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst"
      minutes:
        description: "time budget per model job"
        default: "40"
      promote:
        description: "Copy preview/ onto the live keys and stop. Leave false to publish into the prefix below."
        type: boolean
        default: false
      prefix:
        description: "R2 prefix for this encode. preview/ is the shared preview. preview-pr16/ is that deployment."
        default: "preview/"
concurrency:
  group: fast-models
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.promote == true || inputs.promote == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages (catalog publish imports the encoder) + boto3 for R2
        run: pip install -r tools/requirements.txt boto3==1.43.122
      - name: Promote preview keys to live
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
        run: python tools/fast/promote_preview_to_live.py --backup-dir "$RUNNER_TEMP/promote-bak"
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.promote != true && inputs.promote != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        model: [hrrr, rrfs, nbm, gfs, ifs, aifs, eps, aens, gfsw, aensm, epsm, oisst]   # 11-03: gfsw = NOAA WaveWatch III, epsm = EPS single members
    permissions:
      contents: read
      actions: write   # only for the re-dispatch step below
    env:
      WX_CACHE: ${{ github.workspace }}/.wx_cache
      # models to skip (comma list). 11-08: ECMWF 9 km (ifs9) back on (Benjamin), 1 worker with >= 4 GB free.
      FAST_PAUSED: ""
      ON: ${{ contains(format(',{0},', inputs.models || 'hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst'), format(',{0},', matrix.model)) }}
    steps:
      - uses: actions/checkout@v4
        if: env.ON == 'true'
        # Full tree: fast_encode imports regions/stations.json, and a step imports regions/regions.json plus theme/*.json.
      - uses: actions/setup-python@v5
        if: env.ON == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Python packages (same pins as the site) + boto3 for R2
        if: env.ON == 'true'
        run: pip install -r tools/requirements.txt boto3==1.43.122
      - name: Publish new hours to R2
        id: run
        if: env.ON == 'true'
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
          WX_R2_PREFIX: ${{ inputs.prefix || 'preview/' }}
        run: |
          # 11-03: aensm = AIFS ENS single members (tools/fast/aensm_cycle.py: newest 2 runs, one small file per member per hour)
          if [ "${{ matrix.model }}" = "oisst" ]; then python tools/fast/oisst_cycle.py; exit 0; fi   # 11-03: NOAA OISST SST anomaly (daily)
          if [ "${{ matrix.model }}" = "aensm" ]; then python tools/fast/aensm_cycle.py --minutes "${{ inputs.minutes || '40' }}" --workers 4; exit 0; fi
          # 11-03: epsm = ECMWF EPS single members (tools/fast/epsm_cycle.py: newest 2 00Z/12Z runs, one 2-tile WebP per member per hour)
          if [ "${{ matrix.model }}" = "epsm" ]; then python tools/fast/epsm_cycle.py --minutes "${{ inputs.minutes || '40' }}" --workers 4; exit 0; fi
          python tools/fast/fast_cycle.py --models "${{ matrix.model }}" --minutes "${{ inputs.minutes || '40' }}" --workers 4 --watch
      - name: Promote this model's verified run to live (on; set repo variable AUTO_PROMOTE_LIVE=false to stop)
        # Only after a scheduled/chained publish into the shared preview/. Never replaces a fuller live run with a partial one.
        if: ${{ always() && env.ON == 'true' && vars.AUTO_PROMOTE_LIVE != 'false' && (inputs.prefix || 'preview/') == 'preview/' && contains(',hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,', format(',{0},', matrix.model)) }}
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
        run: python tools/fast/auto_promote_live.py --models "${{ matrix.model }}"
      - name: Re-dispatch (this model still had hours to do when its time budget ran out)
        if: steps.run.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast-models.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
