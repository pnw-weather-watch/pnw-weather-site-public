# Fast-style model data -> R2 bucket pnw-models-data. This is the only model workflow in the repo:
# HRRR, RRFS, NBM, GFS, IFS, AIFS, EPS, AIFS ENS, WW3, AIFS ENS members, EPS members, OISST, and RRFS 13 km NA (rrfsna, last so it cannot take turns from the hourly models) are jobs here.
# Writes go to preview/ keys (WX_R2_PREFIX) unless a dispatch sets prefix to a deployment area
# such as preview-pr16/. Production keeps reading the live keys until someone runs this
# workflow by hand with promote=true, which copies preview/ onto the live keys and does not encode.
# Promote does not copy preview-pr16/ or any other preview-<name>/ prefix.
# Schedule is every 15 min. Three publish legs run in parallel (hourly = hrrr,rrfs,nbm;
# synoptic = gfs,ifs,aifs,eps,aens,gfsw; members/daily = aensm,epsm,oisst,rrfsna last)
# so they do not share a concurrency group and a re-dispatch of one cannot cancel
# another leg's pending cron. Each job gives due models a turn long enough to encode
# (frame_scheduler.py; 6 minutes for hourly models so it outlasts the encoder's 2-minute
# reserve; 8 minutes for members/daily) and polls the source every 45 s. Models that
# miss a turn or still have hours left are carried to the front of a re-dispatch of
# that same leg, with the same prefix. Manifest and catalog writes use If-Match retries.
# Auto-promote of verified preview runs stays on (AUTO_PROMOTE_LIVE=false stops it).
# GitHub only runs this schedule from the default branch. Public-repo minutes stay
# within the free allowance: at most three concurrent publish jobs, 20-minute budgets,
# 30-minute timeouts, and unused legs are not started.
# Needs repo secrets PNW_R2_ACCESS_KEY_ID and PNW_R2_SECRET_ACCESS_KEY. The Pages API token is the other site and is not read.
name: fast-models
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "comma list: hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst,rrfsna"
        default: "hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst,rrfsna"
      minutes:
        description: "time budget for one fair pass across the selected models (each hourly turn is 6 minutes)"
        default: "20"
      promote:
        description: "Copy preview/ onto the live keys and stop. Leave false to publish into the prefix below."
        type: boolean
        default: false
      prefix:
        description: "R2 prefix for this encode. preview/ is the shared preview. preview-pr16/ is that deployment."
        default: "preview/"
permissions:
  contents: read
jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.promote == true || inputs.promote == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages (catalog publish imports the encoder) + boto3 for R2
        run: pip install -r tools/requirements.txt boto3==1.43.122
      - name: Promote preview keys to live
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
        run: python tools/fast/promote_preview_to_live.py --backup-dir "$RUNNER_TEMP/promote-bak"
  pick-legs:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.promote != true && inputs.promote != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          MODELS: ${{ inputs.models || 'hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst,rrfsna' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "tools/fast")
          import frame_scheduler as fs
          requested = [m for m in os.environ["MODELS"].split(",") if m]
          legs = fs.legs_for_models(requested)
          print("selected legs:", ",".join(legs) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("legs=" + json.dumps(legs) + "\n")
          PY
  publish:
    needs: pick-legs
    if: ${{ needs.pick-legs.result == 'success' && needs.pick-legs.outputs.legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.pick-legs.outputs.legs) }}
    concurrency:
      group: fast-models-${{ matrix.leg }}-${{ inputs.prefix || 'preview/' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write   # only for the re-dispatch step below
    env:
      WX_CACHE: ${{ github.workspace }}/.wx_cache
      # models to skip (comma list). 11-08: ECMWF 9 km (ifs9) back on (Benjamin), 1 worker with >= 4 GB free.
      FAST_PAUSED: ""
    steps:
      - uses: actions/checkout@v4
        # Full tree: fast_encode imports regions/stations.json, and a step imports regions/regions.json plus theme/*.json.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Python packages (same pins as the site) + boto3 for R2
        run: pip install -r tools/requirements.txt boto3==1.43.122
      - name: Pick this leg's models
        id: filter
        env:
          REQUESTED: ${{ inputs.models || 'hrrr,rrfs,nbm,gfs,ifs,aifs,eps,aens,gfsw,aensm,epsm,oisst,rrfsna' }}
          LEG: ${{ matrix.leg }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools/fast")
          import frame_scheduler as fs
          requested = [m for m in os.environ["REQUESTED"].split(",") if m]
          models = fs.models_for_leg(os.environ["LEG"], requested)
          print("leg", os.environ["LEG"], "models", ",".join(models) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("models=" + ",".join(models) + "\n")
          if not models:
              raise SystemExit("no models for this leg")
          PY
      - name: Publish new hours to R2
        id: run
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
          WX_R2_PREFIX: ${{ inputs.prefix || 'preview/' }}
        run: python tools/fast/frame_scheduler.py --models "${{ steps.filter.outputs.models }}" --minutes "${{ inputs.minutes || '20' }}" --poll 45
      - name: Promote verified preview runs to live (on; set repo variable AUTO_PROMOTE_LIVE=false to stop)
        # Only after a scheduled/chained publish into the shared preview/. Never replaces a fuller live run with a partial one.
        if: ${{ always() && vars.AUTO_PROMOTE_LIVE != 'false' && (inputs.prefix || 'preview/') == 'preview/' }}
        env:
          PNW_R2_ACCESS_KEY_ID: ${{ secrets.PNW_R2_ACCESS_KEY_ID }}
          PNW_R2_SECRET_ACCESS_KEY: ${{ secrets.PNW_R2_SECRET_ACCESS_KEY }}
        run: python tools/fast/auto_promote_live.py --models "${{ steps.filter.outputs.models }}"
      - name: Re-dispatch (a model still had hours when the budget ran out)
        if: steps.run.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast-models.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f models="${{ steps.run.outputs.more_models || steps.filter.outputs.models }}" -f minutes="${{ inputs.minutes || '20' }}" -f prefix="${{ inputs.prefix || 'preview/' }}" -f promote=false
